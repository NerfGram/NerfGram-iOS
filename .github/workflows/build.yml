name: CI

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path and sync versions.json
        run: |
          set -x
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          ACTUAL_XCODE_VER=$(xcodebuild -version | head -n 1 | awk '{print $2}')
          echo "Active Xcode Version: $ACTUAL_XCODE_VER"
          python3 -c "import json; f=open('versions.json','r+'); d=json.load(f); d['xcode']='$ACTUAL_XCODE_VER'; d['deploy_xcode']='$ACTUAL_XCODE_VER'; f.seek(0); json.dump(d,f,indent=4); f.truncate()"

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Patch Single DC Configuration (3.68.86.217:2398)
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          echo 'Patching Telegram-iOS Datacenter 1 for NerfGram server (3.68.86.217:2398)...'
          find . -type f \( -name '*.swift' -o -name '*.m' -o -name '*.mm' \) -exec sed -i '' 's/149.154.175.50/3.68.86.217/g' {} + || true
          find . -type f \( -name '*.swift' -o -name '*.m' -o -name '*.mm' \) -exec sed -i '' 's/149.154.167.50/3.68.86.217/g' {} + || true
          find . -type f \( -name '*.swift' -o -name '*.m' -o -name '*.mm' \) -exec sed -i '' 's/149.154.175.100/3.68.86.217/g' {} + || true

      - name: Build the App & Dylibs
        run: |
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(( $COMMIT_COUNT + $BUILD_NUMBER_OFFSET ))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          
          # Copy .ipa packages
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            [ -f "$f" ] && cp "$f" $OUTPUT_PATH/NerfGram-iOS.ipa
          done

          # Copy compiled .dylib dynamic libraries
          find bazel-out -type f -name "*.dylib" -exec cp {} $OUTPUT_PATH/ \; || true

          # Copy DSYMs
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            [ -d "$f" ] && cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/NerfGram-iOS.DSYMs.zip" build/DSYMs 1>/dev/null || true

      - name: Upload iOS IPA & Dylib Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NerfGram-iOS-IPA-and-Dylibs
          path: /Users/Shared/telegram-ios/build/artifacts/*
